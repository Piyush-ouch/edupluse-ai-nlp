services:
  - type: web
    name: edupulse-ai-nlp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/build_cache.py
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: LOKY_MAX_CPU_COUNT
        value: "1"
